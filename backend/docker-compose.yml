version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: kopitabo-postgres
    restart: always
    environment:
      POSTGRES_USER: kopitabo
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: kopitabo_pos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
